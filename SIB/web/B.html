<title>الموقع قيد الصيانة</title>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --ink:#0c0e11; --stone:#232830; --line:#2b313a;
  --pewter:#aab1b9; --bone:#dcd6c8; --ember:#b3262e; --torch:#e0a35a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100vh; display:flex; flex-direction:column;
  background:var(--ink); color:var(--bone);
  font:400 1.0625rem/1.85 "IBM Plex Sans Arabic",system-ui,sans-serif;
}
.top{padding:26px clamp(20px,5vw,64px) 0}
.brand{display:inline-block;line-height:0}
.brand img{width:56px;height:56px;display:block;transition:filter .25s}
.brand:hover img{filter:brightness(1.25)}
.brand:focus-visible,.contact a:focus-visible{outline:2px solid var(--torch);outline-offset:4px}

main{
  flex:1; width:100%; max-width:1120px; margin:0 auto;
  padding:clamp(24px,5vh,56px) clamp(20px,5vw,64px);
  display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr);
  gap:clamp(32px,6vw,96px); align-items:center;
}
h1{
  font:700 clamp(2.5rem,5.2vw,4.1rem)/1.25 Amiri,"Noto Naskh Arabic",serif;
  margin:0 0 18px; color:var(--bone);
}
.lead{margin:0;max-width:27em;color:var(--pewter)}
.contact{margin:34px 0 0;font-size:.95rem;color:var(--pewter)}
.contact a{
  color:var(--bone);text-decoration:none;
  border-bottom:1px solid var(--ember);padding-bottom:2px;
  transition:color .2s,border-color .2s;
}
.contact a:hover{color:#fff;border-color:var(--torch)}
.text{animation:enter .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.scene{
  display:block;width:100%;height:auto;max-height:72vh;
  border:1px solid var(--line);background:#101317;
  animation:enter .9s .15s ease-out both;
}
.arm{transform-origin:0 0;animation:strike 3.6s ease-in-out infinite}
@keyframes strike{
  0%,100%{transform:rotate(-34deg)}
  9%{transform:rotate(-44deg)}
  15%{transform:rotate(35deg)}
  27%{transform:rotate(-34deg)}
  37%{transform:rotate(-44deg)}
  43%{transform:rotate(35deg)}
  56%{transform:rotate(-34deg)}
}
.dust{opacity:0;animation:puff 3.6s ease-out infinite}
@keyframes puff{
  0%,14%{opacity:0;transform:none}
  16%{opacity:.6}
  26%{opacity:0;transform:translate(-4px,5px)}
  42%{opacity:0;transform:none}
  44%{opacity:.6}
  54%,100%{opacity:0;transform:translate(-4px,5px)}
}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 2.4s ease-in-out infinite alternate}
@keyframes flicker{from{transform:scale(1,.93)}to{transform:scale(.96,1.05)}}

.foot{padding:0 clamp(20px,5vw,64px) 22px;color:#6f7782;font-size:.85rem}
.rope{display:block;width:100%;max-width:1120px;margin:0 auto 14px}
.foot p{max-width:1120px;margin:0 auto}

@media (max-width:820px){
  main{grid-template-columns:1fr;gap:36px}
  .scene{max-width:440px;margin-inline:auto}
}
@media (prefers-reduced-motion:reduce){
  .text,.scene,.arm,.dust,.flame{animation:none}
  .arm{transform:rotate(-34deg)}
}
</style>
</head>
